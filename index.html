<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Question 💗</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body><div class="hearts" id="hearts"></div>

<main class="card" id="card">
    <div class="emoji">💗</div>

    <h1>Hey, Chisom Ishiekwe! 🥹</h1>

    <p class="message">
        I want to ask you something today....
    </p>

    <h2>Will you buy me toy when you are coming back? 💕</h2>

    <p class="small-text">You Must Say Yes! 🤭</p>

    <div class="button-area" id="buttonArea">
        <button id="yesBtn">YES! 💖</button>
        <button id="noBtn">NO 🙈</button>
    </div>

    <p class="footer">Made from obim just for you</p>
</main>

<div class="success hidden" id="success">
    <div class="success-card">
        <div class="celebration-emoji">🥹💖🎉</div>

        <h1>Yeeeyyy!!! YOU SAID YES!</h1>

        <p>
            I'm going to have toy soon!🥰
        </p>

        <h2>Ohw Ishiekwe 💕</h2>

        <p class="love-message">
            I can't wait to get me toy and forget about you 💗
        </p>

        <button id="againBtn">Thank youuuu🥹</button>
    </div>
</div>

</body>
</html>
